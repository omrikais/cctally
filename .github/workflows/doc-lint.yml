name: Doc lint

# Banned stale-claim phrases must not reappear in public-facing markdown
# (#281 S2 / #280 R2 finding 27): ci.yml skips md-only pull requests via
# paths-ignore, so this workflow is the surface that DOES see them on the
# public mirror. The lint logic lives in bin/cctally-doc-lint-test; a private
# push to main lints its changed docs in ci.yml's changed-checks instead (test
# regime reset), so the docs are linted once. The lint never reads the shared
# memory publication set (#899 S2); the negations follow the positive pattern
# (ordered semantics).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['**/*.md', '!.claude-memory/**', '!.agentmem/codex-memory/**', '!.agentmem/topics.json']

jobs:
  doc-lint:
    # Public-mirror pull requests only, forks included, in GitHub's hosted
    # sandbox. A private pull request runs nothing: private work lands through
    # bin/cctally-merge, never a PR.
    if: github.repository == 'omrikais/cctally'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: doc-lint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: bin/cctally-doc-lint-test
