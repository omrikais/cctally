name: CI

on:
  push:
    branches: [main]
    # A memory-only publication changes nothing changed-checks reads; its exact
    # tree is certified by bin/cctally-memory-publish before the push.
    # `.agentmem/config.json` is configuration, not memory, and still runs CI.
    # Markdown is NOT ignored: changed-checks lints the docs a push changes.
    paths-ignore:
      - '.claude-memory/**'
      - '.agentmem/codex-memory/**'
      - '.agentmem/topics.json'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '.claude-memory/**'
      - '.agentmem/codex-memory/**'
      - '.agentmem/topics.json'

# Every push checks its own range, so no push run is cancelled by a later one;
# a pull request's run is superseded by the next push to it.
# Every job reads only; test-pr's uploads use the runtime token, not this one.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Test regime reset (Codex Q11). A private push to main runs only the static
  # checks of what it changed: the merge command's quick gate ran before the
  # push, and a release verifies its exact commit in release-candidate.yml. The
  # check runs under the runner supervisor's local mode at exactly the pushed
  # commit, waiting at most 300 s for the host lock; a busy host (exit 75)
  # fails the step and is reported as not run, never as a pass. Fork code never reaches
  # a Mac: this job runs only on a push to this repository.
  changed-checks:
    if: github.repository == 'omrikais/cctally-dev' && github.event_name == 'push'
    runs-on: [self-hosted, macOS, ARM64, cctally]
    timeout-minutes: 10
    outputs:
      dashboard: ${{ steps.classify.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The range is diffed locally, so both ends must be in the clone.
          fetch-depth: 0
          persist-credentials: false

      # Whether the range can change the committed dashboard bundle or its
      # source. A range that cannot be read or diffed (a new branch, an
      # all-zero before) counts as yes.
      - name: Classify the pushed paths
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          dashboard=true
          if [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && changed=$(git diff --name-only --no-renames "$BEFORE" "$AFTER"); then
            if ! printf '%s\n' "$changed" \
                | grep -Eq '^(dashboard/(web|static)/|package[^/]*\.json$|\.nvmrc$)'; then
              dashboard=false
            fi
          fi
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"

      # `local` is the step's own process (exec), its final command, so the
      # runner's cancellation signals reach it (Codex Q6 item 1); it writes
      # its exit status to GITHUB_OUTPUT, which the next step reports.
      - name: Check the pushed range
        id: execute
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          CCTALLY_FETCH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 540 ))
          exec "${CCTALLY_RUNNER_PYTHON:?is not set by the runner listener environment}" -I -B \
            "${CCTALLY_RUNNER_TOOL:?is not set by the runner listener environment}" local --sha "$GITHUB_SHA" \
            --fetch-url "https://github.com/$GITHUB_REPOSITORY.git" \
            --deadline-epoch "$deadline" --wait 300 --busy-exit 75 \
            -- python3 bin/cctally-preflight --changed "$BEFORE..$AFTER"

      - name: Report a host that was busy
        if: always()
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          SUPERVISOR_EXIT: ${{ steps.execute.outputs.exit }}
        run: |
          # A skipped or cancelled execute step left no status to report; one
          # that ran and left none is incomplete (Codex Q6 item 6).
          case "${EXECUTE_OUTCOME:-}" in
            success|failure) ;;
            *)
              echo "the execute step did not complete (${EXECUTE_OUTCOME:-unknown}); the runner supervisor was not consulted" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
          esac
          case "${SUPERVISOR_EXIT:-}" in
            75)
              echo "not run: the runner supervisor's host lock was not obtained within 300 s" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error title=changed-checks not run::the host was busy; rerun with: gh run rerun $GITHUB_RUN_ID --failed" ;;
            '')
              echo "::error title=changed-checks incomplete::incomplete: no exit status from the runner supervisor (the execute step's outcome was $EXECUTE_OUTCOME)"
              exit 1 ;;
          esac

  dashboard-build-stability:
    # The committed dashboard/static bundle must be what the source builds to.
    # Only a push whose range can change it (dashboard/web/**,
    # dashboard/static/**, package*.json, .nvmrc) runs this; changed-checks
    # classifies the range. It runs even when changed-checks failed.
    needs: [changed-checks]
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.repository == 'omrikais/cctally-dev' &&
      needs.changed-checks.outputs.dashboard == 'true'
    runs-on: [self-hosted, macOS, ARM64, cctally]  # committed bytes were generated on macOS; native bindings vary by OS
    timeout-minutes: 20  # provisioning + vite build; headroom over the observed few-min run (#279 S7 W4)
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The build and the byte check run under the runner supervisor, as
      # changed-checks does, which provisions node and node_modules from the
      # lockfile; a busy host (exit 75) is reported as not run, never as a pass.
      # As changed-checks: `local` is exec'd, and the next step reports.
      - name: Build the dashboard and verify dashboard/static/ is byte-stable
        id: execute
        env:
          CCTALLY_FETCH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1080 ))
          exec "${CCTALLY_RUNNER_PYTHON:?is not set by the runner listener environment}" -I -B \
            "${CCTALLY_RUNNER_TOOL:?is not set by the runner listener environment}" local --sha "$GITHUB_SHA" \
            --fetch-url "https://github.com/$GITHUB_REPOSITORY.git" \
            --deadline-epoch "$deadline" --wait 300 --busy-exit 75 \
            -- bash -c 'set -eu; (cd dashboard/web && npm run build); git diff --exit-code dashboard/static/'

      - name: Report a host that was busy
        if: always()
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          SUPERVISOR_EXIT: ${{ steps.execute.outputs.exit }}
        run: |
          # A skipped or cancelled execute step left no status to report; one
          # that ran and left none is incomplete (Codex Q6 item 6).
          case "${EXECUTE_OUTCOME:-}" in
            success|failure) ;;
            *)
              echo "the execute step did not complete (${EXECUTE_OUTCOME:-unknown}); the runner supervisor was not consulted" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
          esac
          case "${SUPERVISOR_EXIT:-}" in
            75)
              echo "not run: the runner supervisor's host lock was not obtained within 300 s" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error title=dashboard-build-stability not run::the host was busy; rerun with: gh run rerun $GITHUB_RUN_ID --failed" ;;
            '')
              echo "::error title=dashboard-build-stability incomplete::incomplete: no exit status from the runner supervisor (the execute step's outcome was $EXECUTE_OUTCOME)"
              exit 1 ;;
          esac

  test-pr:
    # Hosted PR signal lane (#281 S2 / #280 R2): public-mirror PRs (including
    # forks) run in GitHub's sandbox with a read-only token and no secrets.
    # Private pull requests run nothing: private work lands through
    # bin/cctally-merge, never a PR. This lane is a SIGNAL, not merge
    # enforcement: no branch-protection required checks (they'd reject the
    # direct-push merge-back flow and strand md-only PRs on path filters).
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'omrikais/cctally'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: test-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # A missing hard capability is a refusal to start on this lane too
      # (#529 S1). pytest, pytest-timeout, PyYAML, rich and ShellCheck come from the pip install
      # step, node/npm from setup-node plus `npm ci`, and fts5 from Ubuntu's
      # libsqlite3, which Debian builds with --enable-fts5. `agentmem` is not
      # asserted here: this lane declares hosted-private-unavailable below, and
      # the capability is gated on the effective policy.
      CCTALLY_AUTHORITATIVE_RUN: "1"
      # Keep the nested shell-harness pool narrow on the hosted runner without
      # collapsing the later, solo pytest phase to two xdist workers. With the
      # combined CCTALLY_TEST_JOBS=2 knob, two consecutive PR runs spent
      # 1112–1131s in pytest alone; an outer-only override leaves pytest at the
      # runner's detected core count while the derived inner cap stays 2.
      CCTALLY_OUTER_JOBS: "2"
      # The hosted token cannot read the separate private agentmem repository.
      # Declare that boundary explicitly so missing-dependency skips cannot be
      # mistaken for self-hosted integration coverage.
      CCTALLY_AGENTMEM_TEST_POLICY: "hosted-private-unavailable"
      LC_ALL: "C.UTF-8"                                 # deterministic encoding/collation
      TZ: "Etc/UTC"                                     # repo gotcha: Etc/UTC, not UTC
      CCTALLY_TEST_RUN_ID: pr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false                    # PR lane never needs a persisted token
          # tests/test_schema_delivery_parity.py needs release tags and the
          # history that decides ancestry.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version-file: 'dashboard/web/.nvmrc'
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Install recovery-capable SQLite CLI
        run: .github/scripts/install-recovery-sqlite.sh "$RUNNER_TEMP/cctally-sqlite"
      - name: Assert required CLI tools present
        run: |
          # Harnesses shell out to these (jq: dashboard/migrations goldens;
          # column: table renders; ps: legacy-poller ownership probe; bc:
          # arithmetic; sqlite3: 5h/migrations state dumps + db repair). The
          # prior step pins the official recovery-capable SQLite shell; assert
          # the remaining tools (with a best-effort install fallback) so a
          # future image dropping one FAILS LOUDLY here rather than surfacing
          # as a confusing golden mismatch deep in the suite (issue #132: a
          # missing `jq` masqueraded as 36 phantom dashboard failures locally).
          missing=""
          for t in sqlite3 jq column ps bc; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::warning::missing CLI tools$missing — installing"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sqlite3 jq bsdmainutils procps bc
          fi
          sqlite3 --version
          sqlite3 :memory: '.recover' >/dev/null
      # tests/requirements-dev.txt IS the toolchain, the same file and the same
      # install bin/cctally-test-remote and the two other authoritative lanes
      # use (#529 S6, F20). --no-deps makes the pin a pin; `pip check` is the
      # closure validator --no-deps otherwise leaves unrun.
      - name: Install Python test deps
        run: |
          python -m pip install --no-deps -r tests/requirements-dev.txt
          python -m pip check

      # FTS5 comes from Ubuntu's libsqlite3, which Debian builds with
      # --enable-fts5 — but nothing in this repository makes that true, so it is
      # asked rather than assumed (#529 S6, M2). The refusal lands before the
      # suite starts. One shared assertion, in probe mode from the contract
      # kernel and in provisioning mode here.
      - name: Assert FTS5 before the suite
        run: bash bin/_lib-fts5-probe.sh require python
      # Every lane that runs cctally-test-all installs dashboard deps, this one
      # included: vitest needs them, and both the share-v2 smoke and
      # bin/cctally-frontend-test inside cctally-test-all then run against a real
      # vitest. ci-linux-matrix used to skip `npm ci` and now performs the same
      # step, and tests/test_frontend_estate_bundle_contract.py enforces the rule
      # across every bundle lane.
      - name: Install dashboard deps (vitest + share smoke)
        working-directory: dashboard/web
        run: npm ci
      - name: Run cctally test suite
        # This phase has its own bound so a genuinely wedged harness is named
        # and terminated before consuming the whole 60-minute job timeout,
        # which also covers the later Vitest and Playwright phases.
        #
        # The full vitest estate used to run again as a separate step here.
        # bin/cctally-frontend-test (#463 S1, finding F23) now runs it inside the
        # bundle, so a second `npx vitest run` on this lane would execute the
        # whole estate twice in the same job. (A file count used to be quoted
        # here; it was stale within weeks, so it is deliberately gone — the point
        # is the duplication, not its size.)
        #
        # #529 S7 (E2). The dashboard-build-stability job used to run the
        # estate again as its own step. It no longer does: the estate has
        # exactly one declared execution per push, inside the bundle.
        #
        # #529 S2. Setting the root turns retained evidence AND console
        # sanitization on. Keep it step-scoped because the runner context is
        # unavailable in job-level env; the failure-only upload below preserves
        # the sanitized extract after $RUNNER_TEMP is deleted.
        env:
          CCTALLY_TEST_EVIDENCE_ROOT: ${{ runner.temp }}/cctally-test-evidence
        run: timeout --kill-after=30s 30m bin/cctally-test-all

      # Failure-only, and BOUNDED: only the two export files, never logs/.
      # `export/` is a sibling of `logs/` and never a parent, so this path
      # cannot capture a raw log even by accident. The independent validator
      # runs again here and REFUSES the artifact rather than transforming it a
      # second time — a single grammar used twice would give a classifier bug
      # two chances at the same text. It is the PUBLIC kernel that runs, because
      # these workflows are mirrored and the public tree carries no private
      # module.
      - name: Validate the sanitized failure extract
        if: failure() || cancelled()
        env:
          CCTALLY_EXTRACT: ${{ runner.temp }}/cctally-test-evidence/local/pr-${{ github.run_id }}-${{ github.run_attempt }}/export/failure-context.txt
        run: |
          python3 - "$CCTALLY_EXTRACT" <<'VALIDATE_PY'
          import importlib.util, pathlib, sys

          path = pathlib.Path(sys.argv[1])
          if not path.is_file() or path.stat().st_size == 0:
              print("::warning::no sanitized failure extract was produced for this run")
              raise SystemExit(0)
          spec = importlib.util.spec_from_file_location(
              "_lib_test_evidence", "bin/_lib_test_evidence.py")
          kernel = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(kernel)
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
          violations = kernel.validate_export(lines)
          if violations:
              for violation in violations[:5]:
                  print("::error::failure-context.txt line %s: %s"
                        % (violation["index"], violation["reason"]))
              # Refuse by REMOVING it: the upload step below is set to ignore a
              # missing file, so nothing unvalidated can reach an artifact. The
              # complete unsanitized logs stay on the runner either way.
              path.unlink()
              print("::error::refusing to upload the failure extract; "
                    "the complete unsanitized logs stay on the runner")
          VALIDATE_PY

      - name: Upload the sanitized failure extract
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: failure-context-pr-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/cctally-test-evidence/local/pr-${{ github.run_id }}-${{ github.run_attempt }}/export/failure-context.txt
            ${{ runner.temp }}/cctally-test-evidence/local/pr-${{ github.run_id }}-${{ github.run_attempt }}/export/outcome.json

      # Reader real-browser smoke net (#281 S3) on the PR lane. External PRs
      # pick up this e2e signal on the public mirror (omrikais/cctally), where
      # hosted sandboxing makes fork code safe and minutes are free.
      - name: Resolve Playwright version (for the browser cache key)
        id: playwright
        working-directory: dashboard/web
        # Read the resolved version straight from package-lock so the cache key
        # tracks exactly the pinned Playwright (and thus its bundled browser).
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install Playwright chromium + OS deps
        working-directory: dashboard/web
        run: npx playwright install --with-deps chromium
      # Build a fresh bundle before the e2e run: test-pr never builds otherwise, so
      # a PR changing React source without regenerating dashboard/static/ would
      # e2e-test the stale committed bundle (spec R12). The push lane skips this —
      # dashboard-build-stability already guards the committed bytes there.
      - name: Build dashboard bundle (fresh — closes the stale-bundle-on-PR hole)
        working-directory: dashboard/web
        run: npm run build
      - name: Run reader e2e suite
        working-directory: dashboard/web
        run: npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reader-pr-artifacts
          path: |
            dashboard/web/playwright-report/
            dashboard/web/test-results/
          retention-days: 7
