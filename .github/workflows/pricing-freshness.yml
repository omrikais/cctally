name: pricing-freshness

# Weekly proactive pricing-drift check (spec 2026-05-29 §5.4). Runs
# `cctally pricing-check --json` and maintains exactly one auto-managed
# `pricing-drift`-labeled tracking issue (create / update / close-on-clean).
# A durable marker in the issue body is the ownership contract; the label alone
# never authorizes the workflow to rewrite or close a manually filed issue.
#
# The zero-lag `/v1/models` existence leg is NEVER exercised here — the
# cron has no OAuth bearer, so it auto-degrades to LiteLLM value-drift +
# missing-from-us only. The local guard (`doctor pricing.coverage`) and
# the maintainer's release pre-flight are the day-0 existence backstop.

on:
  schedule:
    # Weekly, Monday 09:17 UTC. Odd minute to dodge the top-of-hour
    # scheduler congestion GitHub warns about for cron workflows.
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

# Least-privilege: read the checkout, write issues. No other scopes.
permissions:
  contents: read
  issues: write

jobs:
  check:
    # Mirror-safe (spec §5.4): `.github/workflows/**` is allowlisted public,
    # so this file is mirrored to omrikais/cctally verbatim. This guard keeps
    # the scheduled, issue-mutating job from ever firing on the public mirror
    # — it runs ONLY in the private repo. (Analogue of the self-hosted-runner
    # push-only guard in ci.yml.)
    if: github.repository == 'omrikais/cctally-dev'
    runs-on: [self-hosted, macOS, cctally]
    timeout-minutes: 15  # a network fetch + issue update; ample headroom (#279 S7 W4)
    env:
      # Pin gh's target repo so issue ops can never accidentally hit the
      # public mirror, and supply the token in the env — `permissions:`
      # only SCOPES the token; gh reads its auth from GH_TOKEN.
      GH_REPO: omrikais/cctally-dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Run pricing-check (capture rc — exit 1 = drift, not failure)
        id: check
        run: |
          # Use the same brew Python 3.13 as the private test lane, without
          # replacing the runner's PATH (gh and the Actions toolchain remain).
          export PATH="/opt/homebrew/opt/python@3.13/libexec/bin:$PATH"
          # `pricing-check` exits 1 on the exact drift case this job exists
          # to handle, and an Actions `run:` step fails the job on any
          # nonzero exit. Capture stdout + rc WITHOUT aborting, then continue
          # for rc in {0,1} and fail the job only for rc >= 2 (true
          # usage/internal error). The exit-code precedence (§5.2) guarantees
          # rc 1 always carries the actionable findings in OUT.
          set +e
          OUT=$(python3 bin/cctally pricing-check --json)
          rc=$?
          set -e
          if [ "$rc" -ge 2 ]; then
            echo "::error::pricing-check internal error (rc=$rc)"
            printf '%s\n' "$OUT"
            exit "$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$OUT" > /tmp/pricing.json

      - name: Manage the pricing-drift issue
        id: manage
        run: |
          export PATH="/opt/homebrew/opt/python@3.13/libexec/bin:$PATH"
          python3 .github/scripts/pricing_issue.py /tmp/pricing.json

      # A run whose check failed before the issue manager ran created no
      # issue, and records exactly that, so no finished run lacks a result.
      - name: Record a run that created no issue
        id: no_create
        if: always() && steps.manage.outcome == 'skipped'
        run: |
          export PATH="/opt/homebrew/opt/python@3.13/libexec/bin:$PATH"
          python3 .github/scripts/pricing_issue.py --no-create-record

      # Per-attempt provenance. A `github.token` creation triggers no other
      # workflow, so EVERY run attempt uploads the record the script wrote: its
      # `result` (created, updated or no-create), run id and attempt, and for
      # a created or updated issue its number and node id. An audit of issue
      # openings requires one from every attempt, so the name carries the
      # attempt: a re-run never collides with, or is covered by, an earlier
      # attempt's record. The retention must cover the window that audit
      # reads back over.
      - name: Upload the run attempt's provenance record
        if: always() && (steps.manage.outputs.provenance || steps.no_create.outputs.provenance) != ''
        uses: actions/upload-artifact@v4
        with:
          name: pricing-provenance-attempt-${{ github.run_attempt }}
          path: ${{ steps.manage.outputs.provenance || steps.no_create.outputs.provenance }}
          retention-days: 90
          if-no-files-found: error
