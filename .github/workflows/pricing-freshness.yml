name: pricing-freshness

# Weekly proactive pricing-drift check (spec 2026-05-29 §5.4). Runs
# `cctally pricing-check --json`, renders what it found into the run's step
# summary (with a warning annotation when there is drift) and uploads the
# payload as an artifact. It writes no GitHub issue (test regime reset,
# Task 3.6): issues are filed only through the repository's filing helper.
#
# The zero-lag `/v1/models` existence leg is NEVER exercised here — the
# cron has no OAuth bearer, so it auto-degrades to LiteLLM value-drift +
# missing-from-us only. The local guard (`doctor pricing.coverage`) and
# the maintainer's release pre-flight are the day-0 existence backstop.

on:
  schedule:
    # Weekly, Monday 09:17 UTC. Odd minute to dodge the top-of-hour
    # scheduler congestion GitHub warns about for cron workflows.
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

# Least-privilege: read the checkout. No other scopes.
permissions:
  contents: read

jobs:
  check:
    # Mirror-safe (spec §5.4): `.github/workflows/**` is allowlisted public,
    # so this file is mirrored to omrikais/cctally verbatim. This guard keeps
    # the scheduled job, which runs on the self-hosted runner, from ever
    # firing on the public mirror — it runs ONLY in the private repo.
    # (Analogue of the self-hosted-runner push-only guard in ci.yml.)
    if: github.repository == 'omrikais/cctally-dev'
    runs-on: [self-hosted, macOS, cctally]
    timeout-minutes: 15  # a network fetch + a summary; ample headroom (#279 S7 W4)
    steps:
      - uses: actions/checkout@v5

      - name: Run pricing-check (capture rc — exit 1 = drift, not failure)
        id: check
        run: |
          # Use the same brew Python 3.13 as the private test lane, without
          # replacing the runner's PATH (gh and the Actions toolchain remain).
          export PATH="/opt/homebrew/opt/python@3.13/libexec/bin:$PATH"
          # `pricing-check` exits 1 on the exact drift case this job exists
          # to handle, and an Actions `run:` step fails the job on any
          # nonzero exit. Capture stdout + rc WITHOUT aborting, then continue
          # for rc in {0,1} and fail the job only for rc >= 2 (true
          # usage/internal error). The exit-code precedence (§5.2) guarantees
          # rc 1 always carries the actionable findings in OUT.
          set +e
          OUT=$(python3 bin/cctally pricing-check --json)
          rc=$?
          set -e
          if [ "$rc" -ge 2 ]; then
            echo "::error::pricing-check internal error (rc=$rc)"
            printf '%s\n' "$OUT"
            exit "$rc"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # The job's own temp directory, never a host-wide /tmp (#940).
          printf '%s\n' "$OUT" > "${RUNNER_TEMP:?}/pricing.json"

      - name: Summarize the check
        run: |
          export PATH="/opt/homebrew/opt/python@3.13/libexec/bin:$PATH"
          python3 .github/scripts/pricing_summary.py "${RUNNER_TEMP:?}/pricing.json"

      # The payload itself, for whoever acts on a drift the summary reports.
      - name: Upload the pricing-check payload
        uses: actions/upload-artifact@v4
        with:
          name: pricing-check-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing.json
          retention-days: 30
          if-no-files-found: error
