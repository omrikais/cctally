name: CI (Linux multi-version)
on:
  push:
    tags: ['v*']            # post-tag validation of the shipped artifact (fires on the public mirror; #131)
  schedule:
    - cron: '29 7 * * 4'    # weekly Thu 07:29 UTC (public mirror) — offset off pricing-freshness's Mon 09:17
  workflow_dispatch: {}     # manual pre-cut/pre-merge gate (private source — validates an unpublished branch)
jobs:
  test-linux:
    # Free Actions minutes, split by repo (#131):
    #   * public mirror (omrikais/cctally) — runs on ALL triggers (tags +
    #     weekly cron + dispatch). GH-hosted minutes are free on public repos,
    #     and this validates exactly the shipped artifact users npm/brew-install.
    #   * private source (omrikais/cctally-dev) — runs ONLY on a manual
    #     workflow_dispatch (the pre-cut/pre-merge gate for an UNPUBLISHED branch
    #     the public mirror can't see). Tag pushes + the weekly cron skip here
    #     (job `if` false → 0 billable minutes), so they accrue no paid private
    #     Actions cost. The private superset (release/mirror harnesses) stays
    #     covered by the self-hosted macOS push-CI in ci.yml.
    if: >-
      github.repository == 'omrikais/cctally' ||
      (github.repository == 'omrikais/cctally-dev' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60  # headroom over the observed run so a hung test can't wedge the job for GitHub's default 6h (#279 S7 W4)
    strategy:
      fail-fast: false                                 # see all three results
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      # This lane's green is meant to be believed, so a missing hard capability
      # (pytest, fts5, pytest-timeout, PyYAML, rich, ShellCheck, node/npm) is a refusal to start
      # rather than an `incomplete` classification that lets the run continue
      # (#529 S1). Every one of those is provisioned by the steps below —
      # setup-python plus the pip install, setup-node plus `npm ci` — and FTS5
      # comes from Ubuntu's libsqlite3, which Debian builds with --enable-fts5.
      CCTALLY_AUTHORITATIVE_RUN: "1"
      # Outer pool ONLY. The combined CCTALLY_TEST_JOBS knob set all three roles
      # at once, so pinning the pool to 2 also collapsed the later, otherwise-solo
      # pytest phase to 2 workers across all three matrix legs (#529 S5 §2.4).
      # Inner still derives to min(4,2)=2 and release stays auto-capped via the
      # runner (#292); pytest now auto-tunes to the hosted runner's core count.
      # The fleet-constant budget that governs the two LAN runners does not bind
      # this lane: a hosted GitHub runner is separately identified and no routing
      # decision substitutes one hosted lane for another, so CPU discovery here
      # costs no determinism. `test-pr` in ci.yml carries the same corrected form.
      CCTALLY_OUTER_JOBS: "2"
      # #529 S2. The three legs share a run id and an artifact name unless the
      # matrix identity is part of both, so the Python version is spelled into
      # each.
      # Defence in depth, and inert while the line below it stands:
      # `resolve_run_id` consults CCTALLY_TEST_MATRIX_ID only on its
      # GITHUB_ACTIONS fallback, which the explicit CCTALLY_TEST_RUN_ID always
      # pre-empts. It is kept so that dropping the explicit identity degrades
      # to a still-distinct per-leg directory instead of collapsing all three
      # legs onto one, which is the failure it was added for.
      CCTALLY_TEST_MATRIX_ID: ${{ matrix.python-version }}
      CCTALLY_TEST_RUN_ID: linux-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Hosted Actions cannot read the separate private agentmem repository.
      # The self-hosted macOS lane owns that integration gate; this matrix
      # declares the boundary so its skips are explicit rather than accidental.
      CCTALLY_AGENTMEM_TEST_POLICY: "hosted-private-unavailable"
      LC_ALL: "C.UTF-8"                                 # deterministic encoding/collation
      TZ: "Etc/UTC"                                     # repo gotcha: Etc/UTC, not UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python-version }}'
      # Required (NOT dead weight): cctally-test-all glob-runs every bin/cctally-*-test,
      # and cctally-npm-shim-test / cctally-npm-postinstall-test hard-fail (exit 1) without
      # the `node` binary.
      #
      # This lane also runs `npm ci` (#463 S1). It deliberately did not, on the
      # reasoning that the vitest share smoke is OS-agnostic and covered on the
      # macOS push gate. That reasoning no longer holds: bin/cctally-frontend-test
      # puts the whole frontend estate INSIDE bin/cctally-test-all, the aggregator
      # discovers it by its bin/cctally-*-test glob, and the harness fails loudly
      # (never skips) when dashboard/web/node_modules/.bin/vitest is absent. The
      # frontend estate is part of the authoritative bundle, so every lane that
      # runs the bundle must provision it — "the bundle passed" has to mean one
      # thing on every lane. Without this step the lane fails on every tag push,
      # on the weekly cron and on the private manual pre-cut gate, across all
      # three Python versions, and this workflow is published to the public
      # mirror, so it would break the public repository's CI too.
      - uses: actions/setup-node@v5
        with:
          node-version-file: 'dashboard/web/.nvmrc'
          # Hosted ubuntu runners start cold on every job, so the npm cache pays
          # for itself here — the same reason the ephemeral `test-pr` lane in
          # ci.yml keeps it and the persistent self-hosted lanes do not.
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Install dashboard deps (vitest for the frontend estate)
        working-directory: dashboard/web
        run: npm ci
      - name: Install recovery-capable SQLite CLI
        run: .github/scripts/install-recovery-sqlite.sh "$RUNNER_TEMP/cctally-sqlite"
      - name: Assert required CLI tools present
        run: |
          # Harnesses shell out to these (jq: dashboard/migrations goldens;
          # column: table renders; ps: legacy-poller ownership probe; bc:
          # arithmetic; sqlite3: 5h/migrations state dumps + db repair). The
          # prior step pins the official recovery-capable SQLite shell; assert
          # the remaining tools (with a best-effort install fallback) so a
          # future image dropping one FAILS LOUDLY here rather than surfacing
          # as a confusing golden mismatch deep in the suite (issue #132: a
          # missing `jq` masqueraded as 36 phantom dashboard failures locally).
          missing=""
          for t in sqlite3 jq column ps bc; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::warning::missing CLI tools$missing — installing"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sqlite3 jq bsdmainutils procps bc
          fi
          sqlite3 --version
          sqlite3 :memory: '.recover' >/dev/null
      # tests/requirements-dev.txt IS the toolchain, the same file and the same
      # install bin/cctally-test-remote and the two other authoritative lanes
      # use (#529 S6, F20). The pin set is verified to install and close on
      # every interpreter in this matrix — 3.11, 3.12 and 3.13. --no-deps makes
      # the pin a pin; `pip check` is the closure validator --no-deps otherwise
      # leaves unrun. Enforced structurally by tests/test_toolchain_parity.py.
      - name: Install Python test deps
        run: |
          python -m pip install --no-deps -r tests/requirements-dev.txt
          python -m pip check

      # FTS5 comes from Ubuntu's libsqlite3, which Debian builds with
      # --enable-fts5 — but nothing in this repository makes that true, so it is
      # asked rather than assumed (#529 S6, M2). The refusal lands before the
      # suite starts. One shared assertion, in probe mode from the contract
      # kernel and in provisioning mode here.
      - name: Assert FTS5 before the suite
        run: bash bin/_lib-fts5-probe.sh require python
      - name: Run the suite
        # Setting the root turns retained evidence AND console sanitization on;
        # keep this step-scoped because the runner context is unavailable in
        # job-level env. The upload below preserves the sanitized extract after
        # $RUNNER_TEMP is deleted at the end of the job.
        env:
          CCTALLY_TEST_EVIDENCE_ROOT: ${{ runner.temp }}/cctally-test-evidence
        run: bin/cctally-test-all

      # Failure-only, and BOUNDED: only the two export files, never logs/.
      # `export/` is a sibling of `logs/` and never a parent, so this path
      # cannot capture a raw log even by accident. The independent validator
      # runs again here and REFUSES the artifact rather than transforming it a
      # second time — a single grammar used twice would give a classifier bug
      # two chances at the same text. It is the PUBLIC kernel that runs, because
      # these workflows are mirrored and the public tree carries no private
      # module.
      - name: Validate the sanitized failure extract
        if: failure() || cancelled()
        env:
          CCTALLY_EXTRACT: ${{ runner.temp }}/cctally-test-evidence/local/linux-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}/export/failure-context.txt
        run: |
          python3 - "$CCTALLY_EXTRACT" <<'VALIDATE_PY'
          import importlib.util, pathlib, sys

          path = pathlib.Path(sys.argv[1])
          if not path.is_file() or path.stat().st_size == 0:
              print("::warning::no sanitized failure extract was produced for this run")
              raise SystemExit(0)
          spec = importlib.util.spec_from_file_location(
              "_lib_test_evidence", "bin/_lib_test_evidence.py")
          kernel = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(kernel)
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
          violations = kernel.validate_export(lines)
          if violations:
              for violation in violations[:5]:
                  print("::error::failure-context.txt line %s: %s"
                        % (violation["index"], violation["reason"]))
              # Refuse by REMOVING it: the upload step below is set to ignore a
              # missing file, so nothing unvalidated can reach an artifact. The
              # complete unsanitized logs stay on the runner either way.
              path.unlink()
              print("::error::refusing to upload the failure extract; "
                    "the complete unsanitized logs stay on the runner")
          VALIDATE_PY

      - name: Upload the sanitized failure extract
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: failure-context-linux-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/cctally-test-evidence/local/linux-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}/export/failure-context.txt
            ${{ runner.temp }}/cctally-test-evidence/local/linux-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}/export/outcome.json
